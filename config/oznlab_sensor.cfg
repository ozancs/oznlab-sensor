# ======================================================================
# OznLab Sensor - the config
# ======================================================================
# install.sh writes this section into printer.cfg. Keep it in printer.cfg
# itself, not in an included file: SAVE_CONFIG cannot write the values the
# module saves next to a copy in an include. Then OZNLAB_SETUP in the
# console, one step per call.
# NOTE: [stepper_z] position_min must be negative (about -1) - the tap moves
# slightly below zero (install.sh sets it).

[oznlab_sensor hotend]
i2c_mcu: EBBCan               # MCU the sensor is wired to (EBB36 etc.)
i2c_bus: i2c3_PB3_PB4         # EBB36/42 v1.1, v1.2. GEN2: i2c3_PA7_PA6. Other boards: guide step 2.5
i2c_address: 43               # JP1 on 2B = 43 (default), on 2A = 42. With a BTT Eddy on the bus use 2B
tap_adjust_z: 0.04            # added to the measured contact Z (+ = nozzle higher). First layer wrong? babystep, then OZNLAB_TAP_ADJUST
#pa_x: 245                    # where OZNLAB_PRINT_START measures PA: over the purge bucket. Empty = front left corner of the bed
#pa_y: 245
#pa_z: 10                     # nozzle height during the PA test, mm (a purge bucket next to the bed may need less)
clog_gcode: PAUSE             # what the clog watch runs (empty = console message only)
runout_gcode: PAUSE           # what the runout watch runs
#crash_gcode:                 # crash watch (experimental): empty = message only; PAUSE once you trust it
#z_homing: 0                  # 1 = home Z by touching the bed with the nozzle (guide 6.6)
#z_homing_probe: 0            # 1 = the nozzle is also Klipper's [probe]; leave 0 with a BTT Eddy or another probe
#verbose: 0                   # 1 = per-step numbers on the console too (always in klippy.log)
#update_check: 1              # at start, say on the console when a newer version is on GitHub (0 = off)
#report_sensors:              # temperatures shown in OZNLAB_REPORT, e.g. EBB_MCU, chamber (empty = all)

# Written by the module and kept by SAVE_CONFIG, nothing to type: reg_drive_current,
# sens_table (the coil's Hz/um at every nozzle temperature it has tapped at), tap_z, pa_method,
# pa_scale_<filament>, mesh_min / mesh_max / mesh_count, setup_step.
# Everything else (descent speeds, sample counts, thresholds, ratios) has a default that
# the tests were done with; the module's source lists them next to where they are used.


# ---------------------------------------------------------------------
# Macro lines below are commented out so this file is safe to [include].
# Copy them into your own PRINT_START / PRINT_END without the leading '#'.
# ---------------------------------------------------------------------
# Inside PRINT_START, in place of the line that heats the nozzle (M109), BEFORE the prime line
# ---------------------------------------------------------------------
#   # No probe? load the nozzle mesh first (Klipper does not do it by itself):
#   #BED_MESH_PROFILE LOAD=default
#
#   # nozzle to 150 C, tap over the bed centre with a clean tip, heat, filament, PA over the purge area:
#   OZNLAB_PRINT_START EXTRUDER={extruder}     # your printing temperature variable
#   # nozzle wipe macro: add BRUSH=CLEAN_NOZZLE (runs right before the tap)
#   # purge bucket: pa_x / pa_y / pa_z in the section above, not here
#   # slicer without filament_type in the file: add FILAMENT="{params.FILAMENT|default('')}"
#
#   # ... prime line ...
#
#   # At the VERY END of PRINT_START:
#   OZNLAB_MONITOR                    ; clog / runout watch (stops by itself when the print ends)
#   #OZNLAB_CRASH                     ; EXPERIMENTAL crash watch, message only unless crash_gcode is set

# ---------------------------------------------------------------------
# Inside PRINT_END (and CANCEL_PRINT)
# ---------------------------------------------------------------------
#   OZNLAB_PRINT_END
