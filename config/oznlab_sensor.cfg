# ======================================================================
# OznLab Sensor - pieces for printer.cfg
# ======================================================================
# After adding this and restarting Klipper, run OZNLAB_SETUP in the console
# and follow the steps. OZNLAB_CHECK repeats the health report at any time.
# NOTE: [stepper_z] position_min must be negative (about -1) - the tap moves
# slightly below zero.

[oznlab_sensor hotend]
i2c_mcu: EBBCan               # MCU the sensor is wired to (EBB36 etc.)
i2c_bus: i2c3_PB3_PB4         # EBB36/42 v1.1, v1.2. GEN2: i2c3_PA7_PA6. Other boards: guide step 2.5
i2c_address: 43               # JP1 on 2B = 43 (default), on 2A = 42. With a BTT Eddy on the bus use 2B
data_rate: 200
# reg_drive_current: written by LDC_CALIBRATE_DRIVE_CURRENT CHIP=hotend + SAVE_CONFIG
#verbose: 0                   # 1 = per-step numbers on the console too (always in klippy.log)
#update_check: 1              # at start, say on the console when a newer version is on GitHub (0 = off)
# --- Tap (Z offset) ---
tap_adjust_z: 0.04            # added to the measured contact Z (+ = nozzle higher, default 0.04); tune on the first layer
#tap_samples: 5
# --- Pressure advance (measured every print, never written to the config) ---
pa_speed: 3.0                 # test extrusion speed, mm/s of filament (~7 mm3/s)
pa_duration: 1.5              # s
#pa_scale: 0.175              # PA = tau x pa_scale. Written by OZNLAB_PA_SCALE (per filament: pa_scale_asa ...)
#pa_method: rise              # decay = measure from the fall after the extruder stops, if PA says "overshoots"
# --- Clog / runout monitor ---
clog_ratio: 2.0               # measured / normal pressure above this = "high" ...
runout_ratio: 0.25            # ... below this = "low" (no filament / gear slipping)
confirm_windows: 3            # the anomaly must dominate this many consecutive windows ...
confirm_time: 10.0            # ... of this many seconds each before anything fires (single spikes never do)
monitor_min_z: 0.5            # no decisions below this gcode Z (first layer: nozzle/bed contact forces)
clog_gcode: PAUSE
runout_gcode: PAUSE
#baseline_max_drift: 3        # Hz/s safety creep of the baseline while extruding; drift itself is
                              # learned from retract/travel gaps. Small on purpose.
# --- Crash detection (EXPERIMENTAL) ---
# Off by default: it only runs while OZNLAB_CRASH is on. Try OZNLAB_CRASH TEST=1 first,
# leave crash_gcode empty until you have seen it behave in prints, then set it to PAUSE.
#crash_um: 80                 # nozzle push (um) in 15 ms that counts as a hit; the Hz threshold is
                              # crash_um x the sensitivity of the last tap, so it follows the temperature
#crash_step: 150              # Hz floor, only used before the first tap
#crash_settle: 0.25           # s of steady flow before it starts judging
#crash_min_z: 0.6
#crash_gcode:                 # empty = console message only
# --- Bed mesh with the nozzle (printers without a probe; README 6.5) ---
# mesh_min / mesh_max / mesh_count are written by OZNLAB_MESH_SETUP - nothing to type here.
#mesh_samples: 2              # measured taps per point (plus one squash tap that is never used)
#mesh_speed: 150              # xy travel between points, mm/s
#mesh_travel_z: 2             # lift between points, mm
#tap_speed: 2.0               # descent speed of every tap, mm/s (higher values not tested yet)
#mesh_min_temp: 180           # warn below this nozzle temperature (rubbery plastic on the tip)
# --- Z homing with the nozzle (needs trigger_analog in the toolhead firmware; README 6.6) ---
#z_homing: 0                  # 1 = build the MCU trigger, enables OZNLAB_HOME_TEST
#z_homing_probe: 0            # 1 = also be Klipper's [probe]: [stepper_z] endstop_pin: probe:z_virtual_endstop
                              #     leave 0 when the printer already has a probe (BTT Eddy etc.)
#speed: 3                     # homing / PROBE descent speed, mm/s

# --- Print report ---
#report_sensors:              # temperatures shown in OZNLAB_REPORT, e.g. EBB_MCU, chamber
                              # (empty = every [temperature_sensor] and [heater_generic])
# --- Advanced: leave these alone unless a message or the guide tells you to ---
#tap_samples: 5               # taps kept per OZNLAB_TAP
#tap_start_z: 2.0             # height the tap descent starts from, mm
#tap_target_z: -0.3           # lowest point of the descent, mm (needs position_min below it)
#tap_mesh_compensate: True    # subtract the loaded bed mesh at the tap point
#pa_prime: 12                 # mm extruded before the PA measurement (refills the melt zone)
#pa_tau_max: 0.4              # PA fits slower than this (s) are rejected
#flow_exp: 0.6                # clog watch: pressure ~ speed ^ flow_exp
#monitor_min_speed: 0.5       # clog watch judges only above this filament speed, mm/s
#crash_min_z: 0.6             # crash watch is off below this Z
#crash_settle: 0.25           # s of steady flow before the crash watch judges
#crash_sigma: 10              # crash limit never below this x the noise
#mesh_profile:                # profile name for OZNLAB_MESH (default: default, or oznlab next to a probe)
# Written by commands, do not type them: tap_z, thermal_um_c, thermal_ref_t, mesh_min, mesh_max,
# mesh_count, pa_scale_<filament>, reg_drive_current


# ---------------------------------------------------------------------
# Macro lines below are commented out so this file is safe to [include].
# Copy them into your own PRINT_START / PRINT_END without the leading '#'.
# ---------------------------------------------------------------------
# Inside PRINT_START (AFTER the nozzle reached printing temperature, BEFORE the prime line)
# ---------------------------------------------------------------------
#   # No probe? load the nozzle mesh first (Klipper does not do it by itself):
#   #BED_MESH_PROFILE LOAD=default
#
#   # filament + PA over the purge area + 15 s settle + tap over the bed centre:
#   OZNLAB_PRINT_START FILAMENT="{params.FILAMENT|default('')}" PA_X=<purge_x> PA_Y=<purge_y>
#
#   # ... prime line ...
#
#   # At the VERY END of PRINT_START:
#   OZNLAB_MONITOR                    ; clog / runout watch (stops by itself when the print ends)
#   #OZNLAB_CRASH                     ; EXPERIMENTAL crash watch, message only unless crash_gcode is set

# ---------------------------------------------------------------------
# Inside PRINT_END (and CANCEL_PRINT)
# ---------------------------------------------------------------------
#   OZNLAB_PRINT_END
